  <!-- EMAIL FORMULIER -->
  <div class="email-box">

    <h1>Contact</h1>
    <p>Stuur mij een bericht!</p>

    <form action="https://formspree.io/f/xeaqakov" method="POST">

      <label for="name"></label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Je naam"
        required
      >

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="jouw@email.nl"
        required
      >

      <label for="title">Titel</label>
      <input
        type="text"
        id="title"
        name="title"
        placeholder="Waar gaat je bericht over?"
        required
      >

      <label for="comment">Commentaar</label>
      <textarea
        id="comment"
        name="comment"
        placeholder="Schrijf hier je bericht..."
        required
      ></textarea>

      <button type="submit">📨 Versturen</button>

      <p id="status"></p>

    </form>

  </div>

</body>
</html>
